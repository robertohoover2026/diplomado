services:
  diplomado-app:
    build: .
    container_name: diplomado-app
    restart: unless-stopped
    env_file:
      - .env
      - .env.secrets
    volumes:
      - ./public/uploads:/app/public/uploads
    networks:
      - web

  diplomado-db:
    image: postgres:15-alpine
    container_name: diplomado-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - diplomado_data:/var/lib/postgresql/data
    networks:
      - web

networks:
  web:
    external: true

volumes:
  diplomado_data:
