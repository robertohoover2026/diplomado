<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diplomado en Estudio y Formación Política · CESMECA-UNICACH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --maroon: #6B1F2A;
  --gold:   #C8973A;
  --cream:  #FAF6EF;
  --dark:   #1A1210;
  --mid:    #3D2B1F;
  --muted:  #7A6558;
  --border: rgba(107,31,42,0.15);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--dark);
  font-size: 16px;
  line-height: 1.7;
  overflow-x: hidden;
}

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
  height: 64px;
  width: 100vw;
  max-width: 100%;
  box-sizing: border-box;
  overflow: hidden;
  background: rgba(250,246,239,0.97);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.nav-logo {
  font-family: 'Playfair Display', serif;
  font-size: 1rem; font-weight: 700;
  color: var(--maroon); letter-spacing: 0.02em;
}
.nav-links { display: flex; gap: 2rem; list-style: none; }
.nav-links a {
  font-size: 0.85rem; font-weight: 500;
  color: var(--mid); text-decoration: none;
  letter-spacing: 0.04em; text-transform: uppercase;
  transition: color .2s;
}
.nav-links a:hover { color: var(--maroon); }
.nav-cta {
  background: var(--maroon); color: #fff !important;
  padding: 0.45rem 1.2rem; border-radius: 4px;
}
.nav-cta:hover { background: var(--mid) !important; color: #fff !important; }

/* ── HAMBURGER ── */
.nav-hamburger {
  display: none;
  flex-direction: column; justify-content: center; gap: 5px;
  width: 36px; height: 36px; cursor: pointer;
  background: none; border: none; padding: 4px;
  flex-shrink: 0;
}
.nav-hamburger span {
  display: block; height: 2px; width: 100%;
  background: var(--maroon); border-radius: 2px;
  transition: transform .3s, opacity .3s;
}
.nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-hamburger.open span:nth-child(2) { opacity: 0; }
.nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* ── HERO ── */
.hero {
  min-height: 100vh;
  display: grid; grid-template-columns: 1fr 1fr;
  padding-top: 56px;
  position: relative; overflow: hidden; z-index: 1;
}
.hero-left {
  display: flex; flex-direction: column; justify-content: center;
  padding: 8vw 5vw 8vw 8vw;
  position: relative; z-index: 1;
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 0.6rem;
  font-size: 0.78rem; font-weight: 500; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--gold);
  margin-bottom: 1.5rem;
}
.hero-eyebrow::before {
  content: ''; display: block;
  width: 32px; height: 1px; background: var(--gold);
}
.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.8rem, 5vw, 4.2rem);
  font-weight: 900; line-height: 1.08;
  color: var(--maroon); margin-bottom: 1.5rem;
}
.hero h1 em { font-style: italic; color: var(--gold); }
.hero-sub {
  font-size: 1.05rem; color: var(--muted);
  max-width: 480px; margin-bottom: 2.5rem; line-height: 1.75;
}
.hero-meta {
  display: flex; flex-wrap: wrap; gap: 1.5rem;
  margin-bottom: 2.5rem;
}
.meta-pill {
  display: flex; align-items: center; gap: 0.5rem;
  font-size: 0.85rem; font-weight: 500; color: var(--mid);
}
.meta-pill svg { color: var(--gold); flex-shrink: 0; }
.btn-primary {
  display: inline-block;
  background: var(--maroon); color: #fff;
  padding: 1rem 2rem; border-radius: 4px;
  text-decoration: none; font-weight: 500; font-size: 0.95rem;
  letter-spacing: 0.02em;
  transition: background .2s, transform .15s;
}
.btn-primary:hover { background: var(--mid); transform: translateY(-1px); }
.btn-ghost {
  display: inline-block;
  border: 1.5px solid var(--maroon); color: var(--maroon);
  padding: 0.95rem 1.8rem; border-radius: 4px;
  text-decoration: none; font-weight: 500; font-size: 0.95rem;
  margin-left: 1rem;
  transition: all .2s;
}
.btn-ghost:hover { background: var(--maroon); color: #fff; }

.hero-right {
  background: var(--maroon);
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.hero-pattern {
  position: absolute; inset: 0;
  background-image:
    repeating-linear-gradient(45deg, rgba(200,151,58,0.08) 0, rgba(200,151,58,0.08) 1px, transparent 0, transparent 50%);
  background-size: 24px 24px;
}
.hero-card {
  position: relative; z-index: 1;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(200,151,58,0.3);
  border-radius: 8px;
  padding: 3rem 2.5rem;
  width: min(380px, 85%);
  backdrop-filter: blur(4px);
}
.hero-card-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem; color: var(--gold);
  margin-bottom: 1.5rem; font-weight: 700;
}
.stat-row { display: flex; flex-direction: column; gap: 1.2rem; }
.stat-item { border-bottom: 1px solid rgba(200,151,58,0.2); padding-bottom: 1.2rem; }
.stat-item:last-child { border-bottom: none; padding-bottom: 0; }
.stat-num {
  font-family: 'Playfair Display', serif;
  font-size: 2.2rem; font-weight: 900; color: #fff;
  line-height: 1;
}
.stat-label { font-size: 0.82rem; color: rgba(255,255,255,0.55); margin-top: 0.2rem; letter-spacing: 0.06em; text-transform: uppercase; }
.stat-sub { font-size: 0.88rem; color: rgba(255,255,255,0.75); margin-top: 0.4rem; }

/* ── SECTIONS ── */
section { padding: 7rem 8vw; }

.section-label {
  font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--gold); font-weight: 500; margin-bottom: 1rem;
  display: flex; align-items: center; gap: 0.6rem;
}
.section-label::before { content:''; display:block; width:24px; height:1px; background:var(--gold); }
.section-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 3.5vw, 3rem); font-weight: 900;
  color: var(--maroon); line-height: 1.15; margin-bottom: 1.5rem;
}
.section-body { font-size: 1rem; color: var(--muted); max-width: 680px; line-height: 1.8; }

/* ── ABOUT ── */
.about { background: #fff; }
.about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6rem; align-items: center; }
.about-list { margin-top: 2rem; list-style: none; display: flex; flex-direction: column; gap: 1rem; }
.about-list li {
  display: flex; gap: 1rem; align-items: flex-start;
  font-size: 0.95rem; color: var(--mid);
}
.about-list li::before {
  content: ''; flex-shrink: 0;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold); margin-top: 0.6rem;
}
.about-right { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.about-block {
  background: var(--cream); border: 1px solid var(--border);
  border-radius: 6px; padding: 1.8rem 1.5rem;
}
.about-block-icon { font-size: 1.5rem; margin-bottom: 0.8rem; }
.about-block h4 {
  font-family: 'Playfair Display', serif;
  font-size: 1rem; color: var(--maroon); margin-bottom: 0.5rem;
}
.about-block p { font-size: 0.85rem; color: var(--muted); line-height: 1.6; }

/* ── MÓDULOS ── */
.modules { background: var(--cream); }
.modules-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2rem; margin-top: 3rem; }
.module-card {
  border: 1px solid var(--border); border-radius: 8px;
  overflow: hidden; background: #fff;
  transition: transform .2s, box-shadow .2s;
}
.module-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(107,31,42,0.1); }
.module-header {
  background: var(--maroon); padding: 1.8rem 2rem;
  display: flex; justify-content: space-between; align-items: flex-start;
}
.module-num {
  font-family: 'Playfair Display', serif;
  font-size: 3rem; font-weight: 900; color: rgba(255,255,255,0.15);
  line-height: 1;
}
.module-hrs {
  font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--gold); font-weight: 500;
  background: rgba(200,151,58,0.15); border: 1px solid rgba(200,151,58,0.35);
  padding: 0.3rem 0.8rem; border-radius: 20px;
}
.module-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem; font-weight: 700; color: #fff;
  margin-top: 0.5rem; line-height: 1.3;
}
.module-body { padding: 1.8rem 2rem; }
.module-desc { font-size: 0.88rem; color: var(--muted); margin-bottom: 1.2rem; line-height: 1.65; }
.module-units { list-style: none; display: flex; flex-direction: column; gap: 0.6rem; }
.module-units li {
  display: flex; align-items: flex-start; gap: 0.7rem;
  font-size: 0.85rem; color: var(--mid);
}
.unit-dot { flex-shrink:0; width:5px; height:5px; border-radius:50%; background:var(--gold); margin-top:0.6rem; }

/* ── CALENDAR ── */
.calendar { background: var(--maroon); }
.calendar .section-title { color: #fff; }
.calendar .section-label { color: var(--gold); }
.calendar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin-top: 3rem; background: rgba(255,255,255,0.1); border-radius: 8px; overflow: hidden; }
.cal-cell {
  background: rgba(255,255,255,0.04);
  padding: 2rem 1.5rem;
  transition: background .2s;
}
.cal-cell:hover { background: rgba(255,255,255,0.08); }
.cal-period {
  font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--gold); font-weight: 500; margin-bottom: 0.6rem;
}
.cal-date {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem; font-weight: 700; color: #fff;
  margin-bottom: 0.5rem;
}
.cal-desc { font-size: 0.82rem; color: rgba(255,255,255,0.55); line-height: 1.5; }
.cal-sem {
  font-size: 0.75rem; font-weight: 500;
  color: var(--gold);
  background: rgba(200,151,58,0.15); border: 1px solid rgba(200,151,58,0.3);
  padding: 0.2rem 0.6rem; border-radius: 20px;
  display: inline-block; margin-top: 0.6rem;
}

/* ── EVALUACIÓN ── */
.eval { background: #fff; }
.eval-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 5rem; align-items: start; margin-top: 3rem; }
.eval-bars { display: flex; flex-direction: column; gap: 1.8rem; }
.eval-bar-item {}
.eval-bar-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.6rem; }
.eval-bar-label { font-size: 0.9rem; font-weight: 500; color: var(--mid); }
.eval-bar-pct { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 900; color: var(--maroon); }
.eval-bar-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.eval-bar-fill { height: 100%; background: linear-gradient(90deg, var(--maroon), var(--gold)); border-radius: 3px; }
.eval-right {}
.eval-right h3 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--maroon); margin-bottom: 1rem; }
.eval-right p { font-size: 0.95rem; color: var(--muted); line-height: 1.8; margin-bottom: 1rem; }
.perfil-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.5rem; }
.perfil-tag {
  background: var(--cream); border: 1px solid var(--border);
  border-radius: 5px; padding: 1rem 1.2rem;
  font-size: 0.85rem; color: var(--mid);
}
.perfil-tag strong { display: block; color: var(--maroon); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.3rem; }

/* ── INSCRIPCIÓN ── */
.inscripcion { background: var(--cream); }
.insc-inner {
  max-width: 680px; margin: 3rem auto 0;
  background: #fff; border: 1px solid var(--border);
  border-radius: 8px; padding: 3rem;
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
.form-group { display: flex; flex-direction: column; gap: 0.5rem; }
.form-group.full { grid-column: 1 / -1; }
label { font-size: 0.82rem; font-weight: 500; color: var(--mid); letter-spacing: 0.03em; text-transform: uppercase; }
input, select, textarea {
  border: 1.5px solid var(--border);
  border-radius: 5px; padding: 0.75rem 1rem;
  font-family: inherit; font-size: 0.95rem; color: var(--dark);
  background: var(--cream);
  transition: border-color .2s, box-shadow .2s;
  outline: none;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--maroon);
  box-shadow: 0 0 0 3px rgba(107,31,42,0.08);
}
textarea { resize: vertical; min-height: 90px; }
.form-submit { text-align: center; margin-top: 2rem; }
.form-submit button {
  background: var(--maroon); color: #fff;
  border: none; padding: 1rem 3rem; border-radius: 4px;
  font-family: inherit; font-size: 1rem; font-weight: 500;
  cursor: pointer; letter-spacing: 0.02em;
  transition: background .2s, transform .15s;
}
.form-submit button:hover { background: var(--mid); transform: translateY(-1px); }
.form-note { font-size: 0.8rem; color: var(--muted); margin-top: 1rem; }

/* ── CONTACTO ── */
.contacto { background: var(--dark); }
.contacto .section-title { color: #fff; }
.contacto .section-label { color: var(--gold); }
.contact-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2rem; margin-top: 3rem; }
.contact-block { }
.contact-block h4 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--gold); margin-bottom: 0.8rem; }
.contact-block p, .contact-block a {
  font-size: 0.9rem; color: rgba(255,255,255,0.65); line-height: 1.8;
  text-decoration: none;
}
.contact-block a:hover { color: var(--gold); }

/* ── FOOTER ── */
footer {
  background: var(--dark);
  border-top: 1px solid rgba(255,255,255,0.07);
  padding: 2rem 8vw;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 0.8rem; color: rgba(255,255,255,0.35);
}
footer a { color: var(--gold); text-decoration: none; }

/* ── ANIMATIONS ── */
.reveal {
  opacity: 0; transform: translateY(24px);
  transition: opacity .65s ease, transform .65s ease;
}
.reveal.visible { opacity: 1; transform: none; }

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  /* Nav móvil */
  .nav-links {
    display: none;
    flex-direction: column;
    position: fixed; top: 64px; left: 0; right: 0;
    background: rgba(250,246,239,0.98);
    backdrop-filter: blur(12px);
    padding: 1rem 2rem 2rem;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    z-index: 999;
  }
  .nav-links.open { display: flex; }
  .nav-links a { font-size: 1rem; padding: 0.8rem 0; border-bottom: 1px solid var(--border); }
  .nav-links li:last-child a { border-bottom: none; margin-top: 0.5rem; text-align: center; }
  .nav-hamburger { display: flex; flex-shrink: 0; }
  /* Layout */
  .hero { grid-template-columns: 1fr; padding-top: 64px; }
  .hero-right { min-height: 300px; }
  .about-grid, .eval-grid, .modules-grid, .calendar-grid, .contact-grid { grid-template-columns: 1fr; }
  .about-right { grid-template-columns: 1fr 1fr; }
  .form-row { grid-template-columns: 1fr; }
}

/* ── DOCENTES ── */
.docentes { background: #fff; }
.docentes-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem; margin-top: 3rem;
}
.docente-card {
  border: 1px solid var(--border); border-radius: 8px;
  padding: 1.8rem 1.5rem; background: var(--cream);
  transition: transform .2s, box-shadow .2s;
}
.docente-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(107,31,42,0.08); }
.docente-card.coord { border: 2px solid var(--gold); background: #fff; }
.docente-inicial {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--maroon); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700;
  margin-bottom: 1rem;
}
.docente-card.coord .docente-inicial { background: var(--gold); }
.docente-nombre { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; color: var(--maroon); margin-bottom: 0.3rem; line-height: 1.3; }
.docente-institucion { font-size: 0.75rem; color: var(--gold); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.8rem; }
.docente-link { font-size: 0.8rem; color: var(--muted); text-decoration: none; transition: color .2s; }
.docente-link:hover { color: var(--maroon); }
.coord-badge { font-size: 0.7rem; background: var(--gold); color: #fff; padding: 0.2rem 0.6rem; border-radius: 20px; display: inline-block; margin-bottom: 0.6rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }

/* ── PROCESO ── */
.proceso { background: var(--cream); }
.proceso-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; margin-top: 3rem; }
.paso {
  background: #fff; border: 1px solid var(--border);
  border-radius: 8px; padding: 2rem 1.5rem; position: relative;
}
.paso-num {
  font-family: 'Playfair Display', serif; font-size: 3rem; font-weight: 900;
  color: rgba(107,31,42,0.08); line-height: 1; margin-bottom: 0.5rem;
}
.paso-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: var(--maroon); margin-bottom: 0.8rem; }
.paso-desc { font-size: 0.88rem; color: var(--muted); line-height: 1.7; }
.paso-fecha { font-size: 0.8rem; font-weight: 500; color: var(--gold); margin-top: 0.8rem; display: flex; align-items: center; gap: 0.4rem; }

/* Datos bancarios */
.banco-box {
  background: var(--maroon); border-radius: 8px;
  padding: 2.5rem; margin-top: 3rem; color: #fff;
}
.banco-box h3 { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--gold); margin-bottom: 1.5rem; }
.banco-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
.banco-item label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.5); display: block; margin-bottom: 0.3rem; }
.banco-item span { font-size: 1rem; color: #fff; font-weight: 500; }
.banco-note { font-size: 0.82rem; color: rgba(255,255,255,0.6); margin-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem; }

@media (max-width: 900px) {
  .docentes-grid { grid-template-columns: 1fr; }
  .proceso-steps { grid-template-columns: 1fr; }
  .banco-grid { grid-template-columns: 1fr; }
}



<!-- NAV -->
<nav style="display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-sizing:border-box;width:100%;position:fixed;top:0;left:0;right:0;height:64px;z-index:1000;background:rgba(250,246,239,0.97);backdrop-filter:blur(12px);border-bottom:1px solid rgba(107,31,42,0.15);">
  <div class="nav-logo">CESMECA · UNICACH</div>
  <ul class="nav-links" id="nav-links">
    <li><a href="#sobre" onclick="closeMenu()">Sobre el diplomado</a></li>
    <li><a href="#modulos" onclick="closeMenu()">Módulos</a></li>
    <li><a href="#calendario" onclick="closeMenu()">Calendario</a></li>
    <li><a href="#docentes" onclick="closeMenu()">Docentes</a></li>
    <li><a href="/mi-solicitud" onclick="closeMenu()">Mi solicitud</a></li>
    <li><a href="/registro" class="nav-cta" onclick="closeMenu()">Inscribirse</a></li>
  </ul>
  <button id="nav-hamburger" onclick="toggleMenu()" aria-label="Abrir menú" style="display:none;flex-direction:column;justify-content:center;gap:5px;width:32px;height:32px;cursor:pointer;background:none;border:none;padding:4px;flex-shrink:0;">
    <span style="display:block;height:2px;width:100%;background:#6B1F2A;border-radius:2px;transition:transform .3s,opacity .3s;"></span>
    <span style="display:block;height:2px;width:100%;background:#6B1F2A;border-radius:2px;transition:transform .3s,opacity .3s;"></span>
    <span style="display:block;height:2px;width:100%;background:#6B1F2A;border-radius:2px;transition:transform .3s,opacity .3s;"></span>
  </button>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-left reveal">

<script>
// Hamburguesa responsive
function initHamburger() {
  const btn = document.getElementById("nav-hamburger");
  const links = document.getElementById("nav-links");
  if (window.innerWidth <= 900) {
    btn.style.display = "flex";
    links.style.display = "none";
    links.style.flexDirection = "column";
    links.style.position = "fixed";
    links.style.top = "64px";

    links.style.padding = "1rem 2rem 2rem";

  } else {
    btn.style.display = "none";
    links.style.display = "flex";
    links.style.position = "static";
    links.style.flexDirection = "row";
    links.style.background = "none";
    links.style.padding = "0";
    links.style.boxShadow = "none";
  }
}
window.addEventListener("resize", initHamburger);
window.addEventListener("DOMContentLoaded", initHamburger);

// Menú hamburguesa
function toggleMenu() {
  const links = document.getElementById("nav-links");
  const btn = document.getElementById("nav-hamburger");
  const isOpen = links.style.display === "flex";
  links.style.display = isOpen ? "none" : "flex";
}
function closeMenu() {
  const links = document.getElementById("nav-links");
  if (window.innerWidth <= 900) links.style.display = "none";
}
// Cerrar menú al hacer clic fuera
document.addEventListener('click', function(e) {
  const nav = document.querySelector('nav');
  if (!nav.contains(e.target)) closeMenu();
});

// Scroll reveal
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
}, { threshold: 0.1 });
document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

// Form con Formspree
async function handleSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const btn = document.getElementById('btn-submit');
  btn.textContent = 'Enviando...';
  btn.disabled = true;
  try {
    const res = await fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: { 'Accept': 'application/json' }
    });
    if (res.ok) {
      document.getElementById('registro-form').style.display = 'none';
      document.getElementById('form-success').style.display = 'block';
    } else {
      btn.textContent = 'Error al enviar. Intenta de nuevo.';
      btn.style.background = '#a32d2d';
      btn.disabled = false;
    }
  } catch {
    btn.textContent = 'Error de conexión. Intenta de nuevo.';
    btn.style.background = '#a32d2d';
    btn.disabled = false;
  }
}
</script>
